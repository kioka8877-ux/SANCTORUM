name: F01 DOMINION - CPU Test OmniVoice

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/dominion-cpu-test.yml"
      - "F01_DOMINION/CODEBASE/bench_cpu.py"

jobs:
  dominion-cpu-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: System info
        run: |
          echo "RAM   : $(free -h | grep Mem | awk '{print $2}')"
          echo "CPUs  : $(nproc)"
          echo "Disk  : $(df -h / | tail -1 | awk '{print $4}')"

      - name: Install deps
        run: |
          pip install torch torchaudio --index-url https://download.pytorch.org/whl/cpu -q
          pip install omnivoice psutil -q
          python3 -c "import omnivoice; print('[IMPORT] OK')"

      - name: Run benchmark
        run: python3 F01_DOMINION/CODEBASE/bench_cpu.py

      - name: Upload audio
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dominion-cpu-test-output
          path: /tmp/test_output.wav
          retention-days: 3
