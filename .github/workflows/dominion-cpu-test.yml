name: F01 DOMINION - CPU Test OmniVoice

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/dominion-cpu-test.yml"

jobs:
  dominion-cpu-test:
    name: OmniVoice CPU Benchmark
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: System info
        run: |
          echo "RAM total  : $(cat /proc/meminfo | grep MemTotal | awk '{printf "%.1f GB", $2/1024/1024}')"
          echo "RAM libre  : $(cat /proc/meminfo | grep MemAvailable | awk '{printf "%.1f GB", $2/1024/1024}')"
          echo "CPU cores  : $(nproc)"
          echo "Disk libre : $(df -h / | tail -1 | awk '{print $4}')"
          echo "Python     : $(python3 --version)"

      - name: Install OmniVoice CPU
        run: |
          START=$(date +%s)
          pip install torch torchaudio --index-url https://download.pytorch.org/whl/cpu -q
          pip install omnivoice psutil -q
          END=$(date +%s)
          echo "[INSTALL] $((END - START))s"
          python3 -c "import omnivoice; print('[IMPORT] OK')"

      - name: Write inference script
        run: |
          cat > /tmp/bench.py << 'PYEOF_BENCH'
import time
from huggingface_hub import snapshot_download
import subprocess, os, psutil

print("[MODEL] Telechargement k2-fsa/OmniVoice...")
t0 = time.time()
snapshot_download(repo_id="k2-fsa/OmniVoice", local_dir="/tmp/omnivoice_model")
size = subprocess.check_output(["du","-sh","/tmp/omnivoice_model"]).decode().split()[0]
print(f"[MODEL] {time.time()-t0:.0f}s — {size}")

text = "La force de Magnus reside dans la comprehension des lois qui gouvernent l univers. Chaque equation est une verite eternelle."
ram_before = psutil.virtual_memory().available / 1024**3
print(f"[INFER] RAM avant : {ram_before:.1f} GB")

t1 = time.time()
r = subprocess.run(
    ["omnivoice-infer","--model","/tmp/omnivoice_model","--text",text,"--output","/tmp/test_output.wav"],
    capture_output=True, text=True, timeout=600
)
elapsed = time.time() - t1

if r.returncode != 0:
    print(f"[ECHEC] code={r.returncode}")
    print(r.stderr[-3000:])
    raise SystemExit(1)

sz = os.path.getsize("/tmp/test_output.wav")
ram_after = psutil.virtual_memory().available / 1024**3
audio_dur = sz / (2 * 22050)
print(f"[OK] Temps   : {elapsed:.1f}s")
print(f"[OK] WAV     : {sz/1024:.0f} KB")
print(f"[OK] RAM     : {ram_before-ram_after:.1f} GB consommee")
print(f"[OK] Audio   : {audio_dur:.1f}s")
print(f"[OK] RTF     : {elapsed/max(audio_dur,0.1):.2f}x temps reel")
PYEOF_BENCH
          echo "Script ecrit."

      - name: Run benchmark
        run: python3 /tmp/bench.py

      - name: Upload audio
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dominion-cpu-test-output
          path: /tmp/test_output.wav
          retention-days: 3
