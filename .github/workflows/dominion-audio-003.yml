name: dominion-audio-003

on:
  workflow_dispatch:

jobs:
  model-prep:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install deps
        run: |
          pip install huggingface_hub openai-whisper pydub -q
          sudo apt-get install -y ffmpeg
      - name: Download OmniVoice model
        run: python3 F01_DOMINION/CODEBASE/model_prep.py
        env:
          HF_MODEL: k2-fsa/OmniVoice
          MODEL_DIR: /tmp/omnivoice_model
      - name: Prepare ref voice
        run: |
          cp SHARED/IN/ref_voice_003.mp3 /tmp/ref_voice_raw.mp3
          ffmpeg -i /tmp/ref_voice_raw.mp3 -ar 24000 -ac 1 -t 20 /tmp/ref_voice_trim.wav -y
          python3 F01_DOMINION/CODEBASE/dominion_whisper.py /tmp/ref_voice_trim.wav /tmp/ref_text.txt
      - uses: actions/upload-artifact@v4
        with:
          name: model-and-ref
          path: |
            /tmp/omnivoice_model/
            /tmp/ref_voice_trim.wav
            /tmp/ref_text.txt

  split:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Split script
        run: python3 F01_DOMINION/CODEBASE/dominion_split_003.py
      - uses: actions/upload-artifact@v4
        with:
          name: chunks-003
          path: /tmp/chunk_*.txt

  render:
    needs: [model-prep, split]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        chunk_id: [0, 1, 2]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install omnivoice -q
      - uses: actions/download-artifact@v4
        with:
          name: model-and-ref
          path: /tmp/
      - uses: actions/download-artifact@v4
        with:
          name: chunks-003
          path: /tmp/
      - name: Generate chunk
        run: python3 F01_DOMINION/CODEBASE/dominion_worker_custom.py
        env:
          CHUNK_ID: ${{ matrix.chunk_id }}
          CHUNK_FILE: /tmp/chunk_${{ matrix.chunk_id }}.txt
          REF_AUDIO: /tmp/ref_voice_trim.wav
          REF_TEXT_FILE: /tmp/ref_text.txt
          MODEL_PATH: /tmp/omnivoice_model
          OUTPUT_WAV: /tmp/chunk_${{ matrix.chunk_id }}.wav
          LANGUAGE: en
      - uses: actions/upload-artifact@v4
        with:
          name: chunk-${{ matrix.chunk_id }}
          path: /tmp/chunk_${{ matrix.chunk_id }}.wav

  concat:
    needs: render
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pydub -q && sudo apt-get install -y ffmpeg
      - uses: actions/download-artifact@v4
        with:
          pattern: chunk-*
          path: /tmp/chunks/
          merge-multiple: true
      - name: Concat
        run: python3 F01_DOMINION/CODEBASE/dominion_concat_003.py
      - uses: actions/upload-artifact@v4
        with:
          name: voice-003-mp3
          path: /tmp/voice_003.mp3
