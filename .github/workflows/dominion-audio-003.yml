name: dominion-audio-003

on:
  workflow_dispatch:

jobs:
  model-prep:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install deps
        run: |
          pip install huggingface_hub openai-whisper pydub -q
          sudo apt-get install -y ffmpeg
      - name: Download OmniVoice model
        run: |
          python3 -c "
import huggingface_hub
huggingface_hub.snapshot_download('k2-fsa/OmniVoice', local_dir='/tmp/omnivoice_model')
print('Model OK')
"
      - name: Prepare ref voice
        run: |
          cp SHARED/IN/ref_voice_003.mp3 /tmp/ref_voice_raw.mp3
          ffmpeg -i /tmp/ref_voice_raw.mp3 -ar 24000 -ac 1 -t 20 /tmp/ref_voice_trim.wav -y
          python3 -c "
import whisper
model = whisper.load_model('base')
result = model.transcribe('/tmp/ref_voice_trim.wav', language='en')
text = result['text'].strip()
with open('/tmp/ref_text.txt', 'w') as f:
    f.write(text)
print('ref_text:', text[:120])
"
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: model-and-ref
          path: |
            /tmp/omnivoice_model/
            /tmp/ref_voice_trim.wav
            /tmp/ref_text.txt

  split:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Split script into 3 chunks
        run: |
          python3 -c "
import re, json

with open('SHARED/IN/script_003.txt') as f:
    text = f.read().strip()

sentences = re.split(r'(?<=[.!?])\n|\n\n', text)
sentences = [s.strip().replace('\n', ' ') for s in sentences if s.strip()]
print(f'{len(sentences)} sentences')

n = 3
size = max(1, len(sentences) // n)
chunks = []
for i in range(n):
    start = i * size
    end = start + size if i < n - 1 else len(sentences)
    chunk = ' '.join(sentences[start:end])
    if chunk:
        chunks.append(chunk)

for i, c in enumerate(chunks):
    print(f'chunk_{i}: {len(c)} chars: {c[:60]}...')
    with open(f'/tmp/chunk_{i}.txt', 'w') as f:
        f.write(c)
"
      - uses: actions/upload-artifact@v4
        with:
          name: chunks-txt
          path: /tmp/chunk_*.txt

  render:
    needs: [model-prep, split]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        chunk_id: [0, 1, 2]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install omnivoice
        run: pip install omnivoice -q
      - name: Download model + ref
        uses: actions/download-artifact@v4
        with:
          name: model-and-ref
          path: /tmp/
      - name: Download chunk texts
        uses: actions/download-artifact@v4
        with:
          name: chunks-txt
          path: /tmp/
      - name: Generate audio chunk
        env:
          CHUNK_ID: ${{ matrix.chunk_id }}
        run: |
          python3 -c "
import os, subprocess

chunk_id = os.environ['CHUNK_ID']
chunk_file = f'/tmp/chunk_{chunk_id}.txt'
with open(chunk_file) as f:
    text = f.read().strip()

ref_audio = '/tmp/ref_voice_trim.wav'
ref_text_file = '/tmp/ref_text.txt'
model_path = '/tmp/omnivoice_model'
output_wav = f'/tmp/chunk_{chunk_id}.wav'

with open(ref_text_file) as f:
    ref_text = f.read().strip()

print(f'[WORKER {chunk_id}] {len(text)} chars: {text[:60]}...')
print(f'[REF] {len(ref_text)} chars')

cmd = ['omnivoice-infer', '--model', model_path, '--text', text,
       '--language', 'en', '--output', output_wav,
       '--ref_audio', ref_audio, '--ref_text', ref_text]

r = subprocess.run(cmd, capture_output=True, text=True, timeout=3600)
if r.returncode != 0:
    print('STDERR:', r.stderr[-500:])
    raise RuntimeError('omnivoice-infer failed')
print(f'[OK] chunk_{chunk_id}.wav generated')
"
      - uses: actions/upload-artifact@v4
        with:
          name: chunk-${{ matrix.chunk_id }}
          path: /tmp/chunk_${{ matrix.chunk_id }}.wav

  concat:
    needs: render
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pydub -q && sudo apt-get install -y ffmpeg
      - uses: actions/download-artifact@v4
        with:
          pattern: chunk-*
          path: /tmp/chunks/
          merge-multiple: true
      - name: Concat to MP3
        run: |
          python3 -c "
from pydub import AudioSegment
import glob, os

wavs = sorted(glob.glob('/tmp/chunks/chunk_*.wav'))
print(f'{len(wavs)} wavs found')
combined = AudioSegment.empty()
for f in wavs:
    seg = AudioSegment.from_wav(f)
    combined += seg
    print(f'  [+] {os.path.basename(f)}: {len(seg)/1000:.1f}s')
out = '/tmp/voice_003.mp3'
combined.export(out, format='mp3', bitrate='192k')
print(f'[DONE] {len(combined)/1000:.1f}s -> {out}')
"
      - uses: actions/upload-artifact@v4
        with:
          name: voice-003-mp3
          path: /tmp/voice_003.mp3
