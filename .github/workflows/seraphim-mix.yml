name: SANCTORUM - F03B SERAPHIM Mix

on:
  workflow_dispatch:
    inputs:
      project_id:
        description: "ID projet (ex: 004)"
        required: true
        default: "004"
      music_file:
        description: "Nom du fichier musique dans F03_SERAPHIM/IN/ (ex: music_004.mp3)"
        required: true

jobs:
  seraphim-mix:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout SANCTORUM
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}

      - name: Install ffmpeg
        run: sudo apt-get install -y --no-install-recommends --fix-missing ffmpeg

      - name: Install Python deps
        run: pip install --quiet pydub

      - name: Download voice from ANGRON-V2
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          PID="${{ inputs.project_id }}"
          curl -sfL \
            -H "Authorization: token $GH_PAT" \
            "https://raw.githubusercontent.com/kioka8877-ux/ANGRON-V2/main/F02_LACERAT/IN/voice_${PID}.mp3" \
            -o /tmp/voice.mp3 \
          && echo "[DL] voice_${PID}.mp3 OK" \
          || { echo "ERREUR: voice_${PID}.mp3 introuvable dans ANGRON-V2"; exit 1; }

      - name: Check directives exist
        run: |
          PID="${{ inputs.project_id }}"
          DIRECTIVES="F03_SERAPHIM/OUT/directives_${PID}.json"
          if [ ! -f "$DIRECTIVES" ]; then
            echo "ERREUR: $DIRECTIVES absent — le sandbox doit pousser les directives avant ce workflow"
            exit 1
          fi
          echo "[CHECK] directives_${PID}.json OK"
          cat "$DIRECTIVES"

      - name: Assemble mix + push vers ANGRON-V2
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          PID="${{ inputs.project_id }}"
          python3 F03_SERAPHIM/CODEBASE/seraphim_b.py \
            --directives "F03_SERAPHIM/OUT/directives_${PID}.json" \
            --music      "F03_SERAPHIM/IN/${{ inputs.music_file }}" \
            --voice      /tmp/voice.mp3 \
            --output     /tmp/master_audio_mix_${PID}.mp3 \
            --project-id "$PID" \
            --push
